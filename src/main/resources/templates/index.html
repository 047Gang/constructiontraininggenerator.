<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор документов обучения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            padding-right: 45px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .tools-list {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .tools-title {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .tool-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
            font-size: 14px;
            color: #555;
        }

        .tool-item:hover {
            background: #f0f2f8;
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0099cc;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0066aa;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Генератор Документов</h1>
        <p class="subtitle">Генерация сертификатов обучения для строительных инструментов</p>

        <div class="info-box">
            ℹ️ Заполните форму ниже и получите готовый PDF сертификат о прохождении инструктажа
        </div>

        <form id="certificateForm">
            <div class="form-group">
                <label for="employeeName">Имя сотрудника *</label>
                <input type="text" id="employeeName" name="employeeName" placeholder="Введите полное имя" required>
            </div>

            <div class="form-group">
                <label for="toolName">Инструмент *</label>
                <select id="toolName" name="toolName" required>
                    <option value="">-- Выберите инструмент --</option>
                    <option th:each="tool : ${tools}" th:value="${tool.name}" th:text="${tool.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="trainer">Инструктор</label>
                <input type="text" id="trainer" name="trainer" placeholder="Имя инструктора (опционально)">
            </div>

            <button type="submit">📄 Скачать сертификат</button>
        </form>

        <div class="tools-list">
            <div class="tools-title">📋 Доступные инструменты:</div>
            <div th:each="tool : ${tools}" class="tool-item" th:text="${tool.name}"></div>
        </div>
    </div>

    <script>
        document.getElementById('certificateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const employeeName = document.getElementById('employeeName').value;
            const toolName = document.getElementById('toolName').value;
            const trainer = document.getElementById('trainer').value || 'Инструктор';

            if (!employeeName || !toolName) {
                alert('Пожалуйста, заполните все обязательные поля!');
                return;
            }

            const params = new URLSearchParams({
                employeeName: employeeName,
                toolName: toolName,
                trainer: trainer
            });

            window.location.href = '/generate-certificate?' + params.toString();
        });
    </script>
</body>
</html>
